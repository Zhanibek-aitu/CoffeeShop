<body>
    <header id="main-header">
        <nav class="nav-menu">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="services.html">Services</a>

            <a href="blog.html">Blog</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h1>Contact Us</h1>

        <form id="contact-form" class="card">
            <label for="username">Full Name:</label><br>
            <input type="text" id="username" name="username" required><br><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="service-select">Inquiry Type:</label><br>
            <select id="service-select" name="service">
                <option value="table">Table Reservation</option>
                <option value="catering">Event Catering</option>
                <option value="subscription">Coffee Subscription</option>
            </select><br><br>

            <label for="favorite-color">Pick Your Favorite Theme Color:</label><br>
            <input type="color" id="favorite-color" name="favorite-color" value="#8c5a3c"><br><br>

            <label for="message">Your Message:</label><br>
            <textarea id="message" name="message" rows="5" required></textarea><br><br>

            <button type="submit" class="btn">Send Message</button>
        </form>
    </main>

    <footer>
        <p>Created by: Zhanibek Abilkhan, Madiyar Kosaman, Ersaiyn Taiteliyev, Yersin Sarsengali</p>
    </footer>
